<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>موقع فيديوهات المستخدم - Dark Web Maze</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
html, body {
    background-color: #06070b !important;
    margin:0; min-height:100vh; font-family: 'Orbitron', sans-serif;
    color:#dfefff; overflow-x:hidden;
}
.container{padding:120px 18px 80px; max-width:1200px; margin:0 auto;}
.grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:16px;}
.card{background:#06070b; border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.03);}
.thumb-container{position:relative; width:100%; height:185px; overflow:hidden; content-visibility:auto;}
.thumb{width:100%; height:100%; object-fit:cover; display:block; loading:lazy;}
.play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:rgba(0,0,0,0.6);border:2px solid #ff0000;color:#ff0000;
width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:20px;cursor:pointer;transition:0.3s;}
.play-icon:hover{transform:translate(-50%,-50%) scale(1.1);}
.card-body{padding:12px;}
.title-container{padding:10px; background:rgba(0,0,0,0.3);}
.title{font-size:14px; font-weight:700; color:#fff; max-height:3.6em; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;}
.title.expanded{max-height:none;-webkit-line-clamp:unset;}
.read-more-btn, .copy-btn{background:none; border:none; color:#ff0000; font-size:12px; cursor:pointer; margin-top:5px; margin-left:5px;}
.empty{padding:40px;text-align:center;color:#9fb7ff}
header{position:fixed; top:0; left:0; right:0; padding:18px 24px; display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.85);}
.brand{font-size:18px;color:#ff0000; font-weight:700;}
.hero{background: linear-gradient(90deg, rgba(0,0,0,0.45), transparent); padding:18px; border-radius:10px; margin-bottom:14px; color:#cfe8ff; display:flex; align-items:center; gap:12px;}
.hero h1{margin:0;font-size:20px;}
.hero p{margin:0;color:#9fb7ff;font-size:13px}
.profile-btn{position:fixed; bottom:22px; right:22px; background:#ff0000; color:#001; width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; z-index:999;}
#profileModal{position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.92); display:none; flex-direction:column; align-items:center; padding:100px 20px; overflow-y:auto; z-index:2000;}
.profile-card{text-align:center;color:#eaffff;}
.profile-pic{width:120px;height:120px;border-radius:50%;object-fit:cover;border:2px solid #ff0000;}
.uid{margin:10px 0;color:#ff0000;font-size:14px;}
.devs{margin-top:30px;width:100%;max-width:500px;}
.dev{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.05);padding:10px;border-radius:10px;margin-bottom:10px;}
.dev img{width:50px;height:50px;border-radius:50%;object-fit:cover;}
.stars{color:gold;font-size:14px;}
.close-btn{position:absolute;top:20px;right:20px;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;}
#maintenancePage,#updatePage{display:none; position:fixed;top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.95); color:#fff; z-index:5000; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;}
.btn-update{background:#ff0000;color:#001;padding:10px 20px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:20px;}
</style>
</head>
<body>
<div id="maintenancePage">
  <h1>🚧 الموقع تحت الصيانة</h1>
  <p>سيتم العودة قريبًا... يرجى المحاولة لاحقًا</p>
</div>

<div id="updatePage">
  <h1>📦 تحديث جديد متوفر</h1>
  <p>يجب تحديث التطبيق للاستمرار في استخدامه</p>
  <button id="updateBtn" class="btn-update">تحميل التحديث</button>
</div>

<div id="mainContent" style="display:none;">
  <header>
    <div class="brand">Dark Web Maze</div>
  </header>

  <div class="container">
    <div class="hero">
      <div>
        <h1>أحدث الفيديوهات المنشورة</h1>
        <p>𝐃𝐚𝐫𝐤 𝗪𝗲𝗯 𝐌𝐚𝐳𝗲 𝗼𝗳 𝐃𝐚𝐫𝐤𝐧𝐞𝐬𝐬</p>
      </div>
    </div>

    <div id="videosGrid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">لا توجد فيديوهات حتى الآن</div>
  </div>

  <div class="profile-btn" onclick="openProfile()">👤</div>

  <div id="profileModal">
    <button class="close-btn" onclick="closeProfile()">×</button>
    <div class="profile-card">
      <img src="https://img.freepik.com/free-photo/dark-background-hacked-compromised-system-3d-illustration_1419-2810.jpg" class="profile-pic">
      <div class="uid" id="deviceId"></div>
      <div class="devs" id="devsList"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const firebaseUserConfig = {  
  apiKey: "AIzaSyDsTkCfbUJK3bnV4GI0caSHE8XOTggnnYI",  
  authDomain: "alio-6eb47.firebaseapp.com",  
  databaseURL: "https://alio-6eb47-default-rtdb.firebaseio.com",  
  projectId: "alio-6eb47",  
  storageBucket: "alio-6eb47.appspot.com",  
  messagingSenderId: "584481268869",  
  appId: "1:584481268869:android:b3543e690574bc8410b5ec"  
};
const userApp = firebase.initializeApp(firebaseUserConfig, "userApp");  
const db = userApp.database();

const CURRENT_VERSION = 1.0;
const grid = document.getElementById('videosGrid');  
const empty = document.getElementById('empty');  
let currentPlaying = null;

async function checkSystem(){
  const snap = await db.ref('settings').once('value');
  const s = snap.val() || {};
  if(s.maintenance){
    document.getElementById('maintenancePage').style.display='flex';
    return;
  }
  const upd = s.update || {};
  if(upd.force && parseFloat(upd.version) > CURRENT_VERSION){
    document.getElementById('updatePage').style.display='flex';
    document.getElementById('updateBtn').onclick=()=>{window.location.href=upd.url;};
    return;
  }
  document.getElementById('mainContent').style.display='block';
  loadVideosRealtime();
}
checkSystem();

function renderVideoCard(v){
  empty.style.display='none';
  const div = document.createElement('div');
  div.className = 'card';

  const titleContainer = document.createElement('div');
  titleContainer.className = 'title-container';

  const title = document.createElement('div');
  title.className='title';
  title.textContent = v.title || 'بدون عنوان';

  const readBtn = document.createElement('button');
  readBtn.className='read-more-btn';
  readBtn.textContent='قراءة المزيد';
  readBtn.onclick = ()=> {
    title.classList.toggle('expanded');
    readBtn.textContent = title.classList.contains('expanded') ? 'إخفاء النص' : 'قراءة المزيد';
  };

  const copyBtn = document.createElement('button');
  copyBtn.className='copy-btn';
  copyBtn.textContent='📋 نسخ النص';
  copyBtn.onclick = ()=> navigator.clipboard.writeText(title.textContent).catch(()=>{});

  titleContainer.appendChild(title);
  titleContainer.appendChild(readBtn);
  titleContainer.appendChild(copyBtn);

  const thumbContainer = document.createElement('div');
  thumbContainer.className='thumb-container';

  const img = document.createElement('img');
  img.className='thumb';
  img.src = v.thumbURL || 'https://via.placeholder.com/640x360?text=No+Thumbnail';
  img.alt = v.title || 'بدون عنوان';

  const playIcon = document.createElement('div');
  playIcon.className='play-icon';
  playIcon.textContent='▶';
  playIcon.onclick = ()=> playVideo(thumbContainer, v.videoURL);

  thumbContainer.appendChild(img);
  thumbContainer.appendChild(playIcon);

  const cardBody = document.createElement('div');
  cardBody.className='card-body';
  const dateDiv = document.createElement('div');
  dateDiv.style='font-size:12px;color:#9fb7ff;margin-bottom:8px';
  dateDiv.textContent = new Date(v.publishedAt||0).toLocaleString();
  cardBody.appendChild(dateDiv);

  div.appendChild(titleContainer);
  div.appendChild(thumbContainer);
  div.appendChild(cardBody);

  grid.appendChild(div);
}

function playVideo(container, url){
  if(currentPlaying && currentPlaying !== container){
    const oldVideo = currentPlaying.querySelector('video');
    if(oldVideo) oldVideo.pause();
    const oldThumb = currentPlaying.querySelector('.thumb');
    if(oldThumb) oldThumb.style.display='block';
    const oldIcon = currentPlaying.querySelector('.play-icon');
    if(oldIcon) oldIcon.style.display='flex';
  }
  const img = container.querySelector('.thumb');
  const icon = container.querySelector('.play-icon');
  if(img) img.style.display='none';
  if(icon) icon.style.display='none';

  const video = document.createElement('video');
  video.src = url;
  video.controls = true;
  video.autoplay = true;
  video.onended = ()=> {
    video.remove();
    if(img) img.style.display='block';
    if(icon) icon.style.display='flex';
    currentPlaying = null;
  };
  container.appendChild(video);
  currentPlaying = container;
}

function loadVideosRealtime(){
  const ref = db.ref('videos7').orderByChild('publishedAt');
  ref.on('child_added', snap => renderVideoCard(snap.val()));
}

function getUniqueId(){
  let uid = localStorage.getItem('device_uid');
  if(!uid){ uid = 'UID-' + Math.random().toString(36).substring(2,10).toUpperCase(); localStorage.setItem('device_uid', uid); }
  return uid;
}

function openProfile(){
  document.getElementById('profileModal').style.display='flex';
  document.getElementById('deviceId').innerText = getUniqueId();
  const devs = [
    {name:'CyberWolf', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_1CQWnkaCQf1oc0uiutDxs1J6Sl4yYTkd0VPME_gTFkpnGw2LVY7XeYs&s', stars:5},
    {name:'NeoByte', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYXEglUT0QfIkJhawqsKY0NnNNqhQGpmDDarKDguYnXA&s=10', stars:4},
    {name:'GhostCoder', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSn464FoeedZRj_M0VRk0lZUSV10MDmBBc0BbtTgTpGdQ&s=10', stars:3},
    {name:'AnonRoot', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRyMDGQMDS4SXphtFEZY50icL5tRotlupvBphiyR6uVag&s=10', stars:5},
    {name:'ZeroHack', img:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlLdi3Bzhgh7tUznsWYCmF-4I3ugAf6BKSoAT6P78jZg&s=10', stars:4}
  ];
  const devsList = document.getElementById('devsList');  
  devsList.innerHTML = '';
  devs.forEach(d=>{
    const div = document.createElement('div');
    div.className='dev';
    div.innerHTML=<img src="${d.img}"><div><div>${d.name}</div><div class="stars">${'★'.repeat(d.stars)}${'☆'.repeat(5-d.stars)}</div></div>;
    devsList.appendChild(div);
  });
}

function closeProfile(){ document.getElementById('profileModal').style.display='none'; }
</script>
</body>
</html>
